name: Déployer
on:
  push:
    branches: [dev, main]
jobs:
  deployer:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
    steps:
      - uses: actions/checkout@v4
      - if: github.ref_name == 'dev'
        run: npx --yes wrangler@4 deploy --env dev
      - if: github.ref_name == 'main' && hashFiles('public-prod/index.html') != ''
        run: npx --yes wrangler@4 deploy --env prod
